<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grupo Luján Financiera — Panel de Administración</title>
<style>
  :root{
    --navy:#0a1424; --navy2:#0d1b2e; --navy3:#122540;
    --gold:#d4af37; --gold2:#f2d675; --goldDark:#a9842a;
    --white:#f5f7fa; --muted:#9fb0c5; --line:#1e3252;
    --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c; --info:#3498db; --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#12294a 0%,var(--navy) 55%);color:var(--white);min-height:100vh}
  a{color:var(--gold2)}
  .wrap{max-width:1080px;margin:0 auto;padding:16px}
  .card{background:linear-gradient(180deg,var(--navy2),var(--navy3));border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;margin:14px 0;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .brand-logo{max-width:340px;width:100%;border-radius:12px}
  h1,h2,h3{margin:.2em 0}.gold{color:var(--gold2)}.muted{color:var(--muted)}.center{text-align:center}
  .btn{cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:.95rem;
    display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 50%,var(--goldDark));color:#241c00}
  .btn-ok{background:var(--ok);color:#04310f}.btn-bad{background:var(--bad);color:#fff}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--white)}
  .btn-block{display:flex;width:100%}
  label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 6px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0c1a30;color:var(--white);font-size:1rem}
  input:focus{outline:none;border-color:var(--gold)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .tabs button{background:#0c1a30;border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
  .tabs button.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241c00;border-color:transparent}
  .badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;margin-left:6px}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
  .pill.pendiente{background:rgba(241,196,15,.15);color:var(--warn);border:1px solid var(--warn)}
  .pill.aprobado{background:rgba(52,152,219,.15);color:var(--info);border:1px solid var(--info)}
  .pill.activo{background:rgba(46,204,113,.15);color:var(--ok);border:1px solid var(--ok)}
  .pill.rechazado{background:rgba(231,76,60,.15);color:var(--bad);border:1px solid var(--bad)}
  .pill.liquidado{background:rgba(212,175,55,.15);color:var(--gold2);border:1px solid var(--gold)}
  .pill.primera{background:rgba(212,175,55,.18);color:var(--gold2);border:1px solid var(--gold)}
  .hidden{display:none!important}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#0c1a30;cursor:pointer}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
  .kv b{color:var(--gold2)}
  .msg{padding:12px 14px;border-radius:10px;margin:10px 0;font-size:.92rem}
  .msg.err{background:rgba(231,76,60,.12);border:1px solid var(--bad);color:#ffd5d0}
  .msg.ok{background:rgba(46,204,113,.12);border:1px solid var(--ok);color:#d6ffe6}
  .msg.info{background:rgba(52,152,219,.12);border:1px solid var(--info);color:#d6ecff}
  .loader{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .loan{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;background:#0c1a30}
  .loan h3{margin:0 0 6px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal img{max-width:100%;max-height:88vh;border-radius:10px}
  .modal .close{position:absolute;top:16px;right:20px;font-size:2rem;color:#fff;cursor:pointer}
  .progressbar{height:10px;background:#0c1a30;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
  .progressbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
  .mini{padding:6px 10px;font-size:.82rem}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= REDISEÑO FUTURISTA ================= */
:root{ --neon:#f2d675; --neon2:#7fd7ff; }
body{font-family:'Exo 2',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 720px at 50% -12%,#0c1f3b 0%,#060d1a 62%);overflow-x:hidden}
h1,h2,h3{font-family:'Orbitron',sans-serif;letter-spacing:.6px}
.wrap{position:relative;z-index:1}

/* fondo animado */
.fx-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.fx-grid{position:absolute;left:-25%;right:-25%;top:-40%;height:150%;
  background-image:linear-gradient(rgba(127,215,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(127,215,255,.09) 1px,transparent 1px);
  background-size:46px 46px;transform:perspective(460px) rotateX(62deg);transform-origin:top center;
  animation:gridmove 14s linear infinite;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 62%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 62%,transparent)}
@keyframes gridmove{to{background-position:0 46px,46px 0}}
.fx-blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.5;mix-blend-mode:screen}
.fx-blob.b1{width:440px;height:440px;background:radial-gradient(circle,#d4af37,transparent 70%);top:-90px;left:-70px;animation:float1 19s ease-in-out infinite}
.fx-blob.b2{width:500px;height:500px;background:radial-gradient(circle,#1e5fa8,transparent 70%);bottom:-140px;right:-90px;animation:float2 23s ease-in-out infinite}
.fx-blob.b3{width:340px;height:340px;background:radial-gradient(circle,#7fd7ff,transparent 70%);top:42%;left:56%;opacity:.22;animation:float3 27s ease-in-out infinite}
@keyframes float1{50%{transform:translate(60px,44px) scale(1.15)}}
@keyframes float2{50%{transform:translate(-54px,-42px) scale(1.1)}}
@keyframes float3{50%{transform:translate(-42px,32px) scale(1.2)}}
.fx-scan{position:absolute;left:0;right:0;height:200px;top:-200px;background:linear-gradient(to bottom,transparent,rgba(212,175,55,.06),transparent);animation:scan 8s linear infinite}
@keyframes scan{to{transform:translateY(125vh)}}

/* tarjetas cristal */
.card{background:linear-gradient(160deg,rgba(18,37,64,.72),rgba(10,20,36,.72));
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  border:1px solid rgba(212,175,55,.22);position:relative;overflow:hidden;
  box-shadow:0 12px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  animation:cardIn .55s cubic-bezier(.2,.75,.2,1) both}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(120deg,rgba(242,214,117,.6),transparent 42%,transparent 58%,rgba(127,215,255,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:.7;pointer-events:none}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.18s}.card:nth-child(4){animation-delay:.26s}
.card:nth-child(5){animation-delay:.34s}.card:nth-child(n+6){animation-delay:.4s}

/* entrada de vistas/pestañas */
.anim-in{animation:viewIn .5s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}

/* logo */
.brand-logo{filter:drop-shadow(0 0 18px rgba(212,175,55,.25));animation:logoIn .8s ease both}
@keyframes logoIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}

/* botones brillo + glow */
.btn{position:relative;overflow:hidden;transition:transform .15s,box-shadow .25s,filter .25s}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transition:left .6s}
.btn:hover::after{left:150%}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(120deg,#f7e29a,#d4af37,#b8892b,#f2d675);background-size:220% 220%;
  animation:goldshift 6s ease infinite;box-shadow:0 8px 26px rgba(212,175,55,.4),inset 0 0 0 1px rgba(255,255,255,.15)}
.btn-gold:hover{box-shadow:0 12px 36px rgba(212,175,55,.7)}
@keyframes goldshift{50%{background-position:100% 50%}}
.btn-wa{box-shadow:0 8px 26px rgba(37,211,102,.4)}

/* inputs */
input,select,textarea{transition:border-color .2s,box-shadow .2s,background .2s;background:rgba(9,20,36,.82)}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(212,175,55,.18),0 0 18px rgba(212,175,55,.15)}

/* pills / montos */
.pill.activo{box-shadow:0 0 14px rgba(46,204,113,.35)}
.pill.pendiente{box-shadow:0 0 14px rgba(241,196,15,.3)}
.gold{text-shadow:0 0 18px rgba(212,175,55,.25)}
.big-amount{text-shadow:0 0 22px rgba(212,175,55,.35)}

/* progreso shimmer */
.progressbar>span{position:relative;overflow:hidden}
.progressbar>span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sheen 2s linear infinite}
@keyframes sheen{to{transform:translateX(100%)}}

/* whatsapp flotante pulso */
.float-wa{animation:wapulse 2.6s ease-in-out infinite}
@keyframes wapulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 0 rgba(37,211,102,.5)}50%{box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 16px rgba(37,211,102,0)}}

/* miniaturas */
.thumb{transition:transform .2s,box-shadow .2s}
.thumb:hover{transform:scale(1.03);box-shadow:0 0 20px rgba(212,175,55,.3)}

/* chips del hero */
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.chip{font-size:.82rem;padding:8px 14px;border-radius:999px;color:#dbe6f3;
  background:rgba(127,215,255,.06);border:1px solid rgba(127,215,255,.22);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:cardIn .6s ease both}
.chip:hover{border-color:rgba(212,175,55,.5);box-shadow:0 0 16px rgba(212,175,55,.25)}

/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(#d4af37,#8a6a1f);border-radius:8px}
::-webkit-scrollbar-track{background:#0a1424}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

$("#btnNoti").addEventListener("click", async ()=>{
  if(!("Notification" in window)){ return alert("Tu navegador no soporta notificaciones."); }
  const p=await Notification.requestPermission();
  $("#btnNoti").textContent = p==="granted" ? "🔔 Avisos activados" : "🔔 Activar avisos";
});

/* ===== Login ===== */
$("#btnLogin").addEventListener("click", async ()=>{
  const email=$("#admEmail").value.trim(), pass=$("#admPass").value;
  if(!email||!pass) return msg($("#loginMsg"),"Escribe correo y contraseña.","err");
  if(!esAdmin(email)) return msg($("#loginMsg"),"Este correo no está autorizado como administrador.","err");
  const btn=$("#btnLogin"); btn.disabled=true; msg($("#loginMsg"),'<span class="loader"></span> Entrando…',"info");
  try{ await signInWithEmailAndPassword(auth,email,pass); }
  catch(e){ msg($("#loginMsg"), "No se pudo entrar: "+(e.code||e.message),"err"); btn.disabled=false; }
});
$("#btnLogout").addEventListener("click",()=>signOut(auth));

/* ===== Estado de sesión ===== */
let unsubSolic=null; const pagoUnsubs={}; let pagosData={};  // pagosData[solicitudId] = {semana:pago}
let solicitudes=[]; let vistoPrimera=false; const conocidasPend=new Set();

onAuthStateChanged(auth, user=>{
  limpiar();
  if(!user){ $("#view-login").classList.remove("hidden"); $("#view-panel").classList.add("hidden"); return; }
  if(!esAdmin(user.email)){ msg($("#loginMsg"),"Este correo no está autorizado.","err"); signOut(auth); return; }
  $("#admWho").textContent = user.email;
  $("#view-login").classList.add("hidden"); $("#view-panel").classList.remove("hidden");
  if("Notification" in window && Notification.permission==="granted"){ $("#btnNoti").textContent="🔔 Avisos activados"; }
  escuchar();
});
function limpiar(){
  if(unsubSolic){unsubSolic();unsubSolic=null;}
  Object.values(pagoUnsubs).forEach(f=>f&&f()); for(const k in pagoUnsubs) delete pagoUnsubs[k];
  pagosData={}; solicitudes=[]; vistoPrimera=false; conocidasPend.clear();
}

/* ===== Escuchar todas las solicitudes ===== */
function escuchar(){
  const qy = query(collection(db,"solicitudes"), orderBy("createdAt","desc"));
  unsubSolic = onSnapshot(qy, snap=>{
    solicitudes=[]; snap.forEach(d=> solicitudes.push({id:d.id, ...d.data()}));

    // Aviso de nuevas solicitudes pendientes (push al admin)
    const pend = solicitudes.filter(s=>s.estado==="pendiente");
    if(vistoPrimera){
      pend.forEach(s=>{ if(!conocidasPend.has(s.id)){ notificar("🟡 Nueva solicitud de préstamo", `${s.nombre} solicita ${money(s.monto)}`); } });
    }
    conocidasPend.clear(); pend.forEach(s=>conocidasPend.add(s.id));
    vistoPrimera=true;

    // Suscribir a pagos de préstamos activos
    solicitudes.filter(s=>s.estado==="activo").forEach(s=>{
      if(!pagoUnsubs[s.id]){
        pagoUnsubs[s.id]=onSnapshot(collection(db,"solicitudes",s.id,"pagos"), psnap=>{
          const prevPend = contarPagosPendientes();
          const m={}; psnap.forEach(p=> m[p.data().semana]=p.data()); pagosData[s.id]=m;
          const nowPend = contarPagosPendientes();
          if(vistoPrimera && nowPend>prevPend){ notificar("💰 Comprobante de pago recibido", `${s.nombre} subió un comprobante`); }
          renderPagos(); renderActivos();
        });
      }
    });
    // limpiar listeners de préstamos que ya no están activos
    Object.keys(pagoUnsubs).forEach(id=>{
      if(!solicitudes.find(s=>s.id===id && s.estado==="activo")){ pagoUnsubs[id](); delete pagoUnsubs[id]; delete pagosData[id]; }
    });

    renderTodo();
  }, err=>{
    $("#tab-pend").innerHTML=`<div class="card"><div class="msg err">No se pudieron cargar las solicitudes: ${err.message}.
      Revisa que el correo esté autorizado y las reglas de Firestore.</div></div>`;
  });
}

function contarPagosPendientes(){
  let n=0; for(const sid in pagosData) for(const w in pagosData[sid]) if(pagosData[sid][w].estado==="pendiente") n++;
  return n;
}

/* ===== Tabs ===== */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    ["pend","pagos","activos","hist"].forEach(t=> $("#tab-"+t).classList.toggle("hidden", t!==b.dataset.tab));
  });
});

/* ===== Render principal ===== */
function renderTodo(){ renderPendientes(); renderPagos(); renderActivos(); renderHistorial(); }

function badge(id,n){ const e=$(id); e.textContent=n; e.classList.toggle("hidden", n===0); }

function docThumb(s){
  return `<div class="grid">
    <div><div class="muted" style="font-size:.8rem;margin-bottom:4px">Credencial / ID</div>
      <img class="thumb" src="${s.credencialURL}" data-img="${s.credencialURL}"></div>
    <div><div class="muted" style="font-size:.8rem;margin-bottom:4px">Comprobante domicilio</div>
      <img class="thumb" src="${s.comprobanteURL}" data-img="${s.comprobanteURL}"></div>
  </div>`;
}
function bindThumbs(container){ container.querySelectorAll("[data-img]").forEach(im=>im.addEventListener("click",()=>verImagen(im.dataset.img))); }

/* --- Pendientes --- */
function renderPendientes(){
  const pend = solicitudes.filter(s=>s.estado==="pendiente");
  badge("#bPend", pend.length);
  const cont=$("#tab-pend");
  if(!pend.length){ cont.innerHTML=`<div class="card center muted">No hay solicitudes pendientes. ✅</div>`; return; }
  cont.innerHTML = pend.map(s=>`
    <div class="card" data-id="${s.id}">
      <div class="topbar">
        <div><h3>${s.nombre} ${s.esPrimerPrestamo?'<span class="pill primera">1ª vez</span>':''}</h3>
          <div class="muted">📞 ${s.telefono} · ${s.email||""}</div>
          <div class="muted" style="font-size:.8rem">Solicitado: ${fmt(s.createdAt)}</div></div>
        <span class="pill pendiente">Pendiente</span>
      </div>
      <div class="kv"><span>Monto solicitado</span><b>${money(s.monto)}</b></div>
      <div class="kv"><span>Cuota semanal</span><b>${money(s.cuotaSemanal)}</b></div>
      <div class="kv"><span>Plazo</span><b>${s.plazo} semanas</b></div>
      <div class="kv"><span>CLABE para depósito</span><b style="letter-spacing:1px">${s.clabe||"—"} ${s.clabe?`<button class="btn btn-ghost mini" data-copy="${s.clabe}" style="margin-left:8px">Copiar</button>`:""}</b></div>
      <div class="grid" style="margin-top:8px">
        <div class="kv"><span>Ref. 1</span><b>${s.ref1Nombre||"—"}<br><span class="muted">${s.ref1Tel||""}</span></b></div>
        <div class="kv"><span>Ref. 2</span><b>${s.ref2Nombre||"—"}<br><span class="muted">${s.ref2Tel||""}</span></b></div>
      </div>
      <div style="margin-top:12px">${docThumb(s)}</div>
      <div class="msg-slot"></div>
      <div class="grid" style="margin-top:12px">
        <button class="btn btn-ok" data-ap="${s.id}">✔ Aprobar</button>
        <button class="btn btn-bad" data-re="${s.id}">✖ Rechazar</button>
      </div>
    </div>`).join("");
  bindThumbs(cont);
  cont.querySelectorAll("[data-ap]").forEach(b=>b.addEventListener("click",()=>aprobar(b.dataset.ap)));
  cont.querySelectorAll("[data-re]").forEach(b=>b.addEventListener("click",()=>rechazar(b.dataset.re)));
  cont.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
    const t=b.dataset.copy;
    const done=()=>{ const o=b.textContent; b.textContent="Copiado ✓"; setTimeout(()=>b.textContent=o,1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(done); } else { done(); }
  }));
}
async function aprobar(id){
  try{ await updateDoc(doc(db,"solicitudes",id), {estado:"aprobado", aprobadoAt:serverTimestamp()}); }
  catch(e){ alert("Error al aprobar: "+(e.message||e.code)); }
}
async function rechazar(id){
  if(!confirm("¿Rechazar esta solicitud?")) return;
  try{ await updateDoc(doc(db,"solicitudes",id), {estado:"rechazado", rechazadoAt:serverTimestamp()}); }
  catch(e){ alert("Error al rechazar: "+(e.message||e.code)); }
}

/* --- Pagos por confirmar --- */
function renderPagos(){
  const cont=$("#tab-pagos"); const items=[];
  solicitudes.filter(s=>s.estado==="activo").forEach(s=>{
    const m=pagosData[s.id]||{};
    Object.values(m).filter(p=>p.estado==="pendiente").sort((a,b)=>a.semana-b.semana)
      .forEach(p=> items.push({s,p}));
  });
  badge("#bPagos", items.length);
  if(!items.length){ cont.innerHTML=`<div class="card center muted">No hay comprobantes por confirmar. ✅</div>`; return; }
  cont.innerHTML = items.map(({s,p})=>`
    <div class="card">
      <div class="topbar">
        <div><h3>${s.nombre}</h3><div class="muted">📞 ${s.telefono} · Préstamo de ${money(s.monto)}</div></div>
        <span class="pill pendiente">Semana ${p.semana}</span>
      </div>
      <div class="kv"><span>Cuota de la semana</span><b>${money(p.cuota||s.cuotaSemanal)}</b></div>
      <div class="kv"><span>Subido</span><b>${fmt(p.uploadedAt)}</b></div>
      <div style="margin-top:10px"><img class="thumb" style="height:200px" src="${p.comprobanteURL}" data-img="${p.comprobanteURL}"></div>
      <div class="grid" style="margin-top:12px">
        <button class="btn btn-ok" data-cp="${s.id}|${p.semana}">✔ Confirmar pago</button>
        <button class="btn btn-bad" data-rp="${s.id}|${p.semana}">✖ Rechazar</button>
      </div>
    </div>`).join("");
  bindThumbs(cont);
  cont.querySelectorAll("[data-cp]").forEach(b=>b.addEventListener("click",()=>{const[i,w]=b.dataset.cp.split("|");confirmarPago(i,+w);}));
  cont.querySelectorAll("[data-rp]").forEach(b=>b.addEventListener("click",()=>{const[i,w]=b.dataset.rp.split("|");rechazarPago(i,+w);}));
}
async function confirmarPago(sid,semana){
  try{
    await updateDoc(doc(db,"solicitudes",sid,"pagos",String(semana)), {estado:"confirmado", confirmadoAt:serverTimestamp()});
    // ¿todas confirmadas? -> liquidado
    const m=pagosData[sid]||{}; let ok=0;
    for(let i=1;i<=CONFIG.PLAZO_SEMANAS;i++){ const p=m[i]; if(i===semana||(p&&p.estado==="confirmado")) ok++; }
    if(ok>=CONFIG.PLAZO_SEMANAS){ await updateDoc(doc(db,"solicitudes",sid), {estado:"liquidado", liquidadoAt:serverTimestamp()}); }
  }catch(e){ alert("Error al confirmar: "+(e.message||e.code)); }
}
async function rechazarPago(sid,semana){
  if(!confirm("¿Rechazar este comprobante? El cliente deberá subirlo de nuevo.")) return;
  try{ await updateDoc(doc(db,"solicitudes",sid,"pagos",String(semana)), {estado:"rechazado", rechazadoAt:serverTimestamp()}); }
  catch(e){ alert("Error: "+(e.message||e.code)); }
}

/* --- Activos --- */
function renderActivos(){
  const cont=$("#tab-activos");
  const act = solicitudes.filter(s=>s.estado==="activo" || s.estado==="aprobado");
  if(!act.length){ cont.innerHTML=`<div class="card center muted">No hay préstamos activos.</div>`; return; }
  cont.innerHTML = act.map(s=>{
    const m=pagosData[s.id]||{}; let conf=0; for(const w in m) if(m[w].estado==="confirmado") conf++;
    const pct = Math.round(conf/s.plazo*100);
    const estadoPill = s.estado==="aprobado" ? '<span class="pill aprobado">Aprobado (esperando aceptación)</span>'
                                             : '<span class="pill activo">Activo</span>';
    return `<div class="card">
      <div class="topbar"><div><h3>${s.nombre}</h3><div class="muted">📞 ${s.telefono} · ${money(s.monto)} · cuota ${money(s.cuotaSemanal)}</div></div>${estadoPill}</div>
      ${s.estado==="activo"?`<div class="muted" style="font-size:.85rem;margin-top:6px">Semanas confirmadas: <b class="gold">${conf}/${s.plazo}</b></div>
      <div class="progressbar"><span style="width:${pct}%"></span></div>`:''}
    </div>`;
  }).join("");
}

/* --- Historial --- */
function renderHistorial(){
  const cont=$("#tab-hist");
  const h = solicitudes.filter(s=>["rechazado","liquidado"].includes(s.estado));
  if(!h.length){ cont.innerHTML=`<div class="card center muted">Sin historial todavía.</div>`; return; }
  cont.innerHTML = h.map(s=>`
    <div class="card">
      <div class="topbar"><div><h3>${s.nombre}</h3><div class="muted">📞 ${s.telefono} · ${money(s.monto)}</div></div>
        <span class="pill ${s.estado}">${s.estado==="liquidado"?"Liquidado ✓":"Rechazado"}</span></div>
    </div>`).join("");
}
</script>
<script>
(function(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function anim(el){ el.classList.remove('anim-in'); void el.offsetWidth; el.classList.add('anim-in'); }
  var targets = document.querySelectorAll('section, [id^="tab-"]');
  var obs = new MutationObserver(function(muts){
    muts.forEach(function(m){
      var el = m.target;
      if(m.attributeName === 'class' && !el.classList.contains('hidden')) anim(el);
    });
  });
  targets.forEach(function(t){
    obs.observe(t, {attributes:true, attributeFilter:['class']});
    if(!t.classList.contains('hidden')) anim(t);
  });
})();
</script>
